name: tdd

on:
  pull_request:
  workflow_dispatch:

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit and contract tests
        run: PYTHONPATH=. uv run --with pytest pytest tests/unit tests/contract -q
