[train]
voc_folder=D:\object_file\total
train_data=train_data.txt
eva_data=eva_data.txt
cluster_anchor=yolo3_anchors.txt
batch_size=32
total_epochs=300

[model]
width=96
height=96

num_heads=1
cluster_number=3
divider=16
#divider = 8
iou_type=iou
body_type=mbv2

obj_scale=8
noobj_scale=1
iou_threshold=0.5
num_classes=5
class_names=tennis,red,blue,brown,white

[inference]
nms_iou_threshold = 0.45
nms_score_threshold=0.45
max_detections = 5
